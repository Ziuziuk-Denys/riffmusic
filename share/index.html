<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Riff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #121214;
      --surface: #1e1f22;
      --surface-high: #28292c;
      --surface-highest: #333438;
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --on-primary-container: #eaddff;
      --on-surface: #e6e6e8;
      --on-surface-variant: #cac4d0;
      --outline: #938f99;
      --outline-variant: #49454f;
      --accent: var(--primary);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Google Sans Text', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .top-banner {
      width: 100%;
      height: 44px;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background-color 0.2s ease;
    }

    .top-banner:hover {
      background: #18181b;
    }

    .top-banner svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .hero-glow {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(600px, 90vw);
      height: 380px;
      background: var(--accent);
      filter: blur(120px) saturate(1.8);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      transition: background 0.6s ease;
    }

    .main-wrap {
      flex: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 64px 24px;
      position: relative;
      z-index: 2;
    }

    .cover-wrap {
      width: 240px;
      height: 240px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--surface-high);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cover-wrap.is-artist {
      border-radius: 50% !important;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-title {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .track-artist {
      font-size: 18px;
      font-weight: 600;
      color: var(--on-surface-variant);
      margin-bottom: 24px;
    }

    .scrubber-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .time-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--outline);
      font-variant-numeric: tabular-nums;
      width: 36px;
    }

    .seek-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-highest);
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .seek-slider:hover::-webkit-slider-thumb {
      transform: scale(1.25);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
      width: 100%;
    }

    .btn-play {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-play:hover {
      transform: scale(1.06);
      filter: brightness(1.08);
    }

    .btn-play svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--on-surface-variant);
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--surface-high);
      color: var(--on-surface);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 999px;
      background: var(--surface-highest);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .action-card {
      width: 100%;
      background: var(--surface);
      border-radius: 20px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
    }

    .action-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--on-surface-variant);
    }

    .btn-cta {
      height: 40px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      transition: filter 0.15s ease;
    }

    .btn-cta:hover {
      filter: brightness(1.1);
    }

    .hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <a href="https://github.com/rootscripts/riff" target="_blank" rel="noopener" class="top-banner">
    <span>Download Riff — your best music app on your device.</span>
    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>

  <div class="hero-glow" id="heroGlow"></div>

  <main class="main-wrap">
    <div class="cover-wrap" id="coverWrap">
      <img id="coverImg" class="cover-img" src="" alt="" style="display: none;">
      <svg id="coverPlaceholder" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--outline);">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
      </svg>
    </div>

    <h1 class="track-title" id="trackTitle">Loading...</h1>
    <div class="track-artist" id="trackArtist"></div>

    <div class="scrubber-container">
      <span class="time-text" id="currentTime">0:00</span>
      <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0">
      <span class="time-text" id="totalDuration">0:00</span>
    </div>

    <div class="controls-row">
      <div class="volume-group">
        <button class="btn-icon" id="btnMute" title="Mute">
          <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.9">
      </div>

      <button class="btn-play" id="btnPlay" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="btn-icon" id="btnCopyLink" title="Copy share link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>

    <div class="action-card">
      <div class="action-text">Enjoy high quality audio, full synchronized lyrics, and offline downloads on Riff.</div>
      <a href="https://github.com/rootscripts/riff" target="_blank" rel="noopener" class="btn-cta">
        <span>Get App</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </main>

  <audio id="nativeAudio" class="hidden-player" preload="metadata"></audio>
  <div id="youtubePlayerHost" class="hidden-player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function parseParameters() {
      const query = window.location.search || window.location.hash || '';
      const params = new Map();
      const clean = query.replace(/^[?#]/, '');
      const segments = clean.split(/[?&]/);
      for (const pair of segments) {
        if (!pair) continue;
        const eqIdx = pair.indexOf('=');
        if (eqIdx !== -1) {
          const key = decodeClean(pair.slice(0, eqIdx));
          const val = decodeClean(pair.slice(eqIdx + 1));
          params.set(key, val);
        }
      }
      return {
        type: params.get('t') || 'music',
        title: params.get('n') || '',
        artist: params.get('a') || '',
        streamUrl: params.get('stream') || '',
        mediaUrl: params.get('url') || '',
        image: params.get('img') || '',
        duration: parseInt(params.get('dur') || '0', 10)
      };
    }

    function decodeClean(str) {
      if (!str) return '';
      try {
        return decodeURIComponent(str.replace(/\+/g, ' ')).trim();
      } catch {
        return str.replace(/\+/g, ' ').trim();
      }
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    const payload = parseParameters();

    const titleElement = document.getElementById('trackTitle');
    const artistElement = document.getElementById('trackArtist');
    const coverWrap = document.getElementById('coverWrap');
    const coverImage = document.getElementById('coverImg');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const pageTitle = document.getElementById('pageTitle');
    const heroGlow = document.getElementById('heroGlow');

    const nativeAudio = document.getElementById('nativeAudio');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeText = document.getElementById('currentTime');
    const totalDurationText = document.getElementById('totalDuration');
    const volumeSlider = document.getElementById('volumeSlider');
    const btnMute = document.getElementById('btnMute');
    const btnCopyLink = document.getElementById('btnCopyLink');

    titleElement.textContent = payload.title || payload.artist || 'Untitled';
    artistElement.textContent = payload.artist || '';
    pageTitle.textContent = payload.title ? `${payload.title} — ${payload.artist}` : 'Riff';

    if (payload.duration > 0) {
      totalDurationText.textContent = formatTime(payload.duration);
      seekSlider.max = payload.duration;
    }

    function applyCoverImage(url) {
      if (!url) return;
      coverImage.src = url;
      coverImage.onload = () => {
        coverImage.style.display = 'block';
        coverPlaceholder.style.display = 'none';
        extractPalette(coverImage, (rgbColor) => {
          if (rgbColor) {
            heroGlow.style.background = rgbColor;
            document.documentElement.style.setProperty('--accent', rgbColor);
          }
        });
      };
    }

    function resolveCover() {
      if (payload.image) {
        applyCoverImage(payload.image);
        return;
      }
      const ytIdMatch = (payload.mediaUrl || '').match(/(?:v=|\/embed\/|\/watch\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
      if (ytIdMatch) {
        applyCoverImage(`https://i.ytimg.com/vi/${ytIdMatch[1]}/hqdefault.jpg`);
        return;
      }
      const query = `${payload.artist} ${payload.title}`.trim();
      if (query) {
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`)
          .then(r => r.json())
          .then(data => {
            const hit = data.results && data.results[0];
            if (hit && hit.artworkUrl100) {
              applyCoverImage(hit.artworkUrl100.replace('100x100', '600x600'));
            }
          })
          .catch(() => {});
      }
    }

    resolveCover();

    function extractPalette(img, callback) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      try {
        ctx.drawImage(img, 0, 0, 16, 16);
        const data = ctx.getImageData(0, 0, 16, 16).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i]; g += data[i + 1]; b += data[i + 2]; count++;
        }
        callback(`rgb(${Math.round(r / count)}, ${Math.round(g / count)}, ${Math.round(b / count)})`);
      } catch {
        callback(null);
      }
    }

    let playbackActive = false;
    let isSeeking = false;
    let youtubePlayerInstance = null;
    let usingYoutubeBackend = false;
    let youtubeReady = false;

    function extractVideoId(rawUrl) {
      if (!rawUrl) return '';
      const match = rawUrl.match(/(?:v=|\/embed\/|\/watch\/|youtu\.be\/|\/v\/|^)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : '';
    }

    const possibleVideoId = extractVideoId(payload.mediaUrl);

    window.onYouTubeIframeAPIReady = function() {
      if (!possibleVideoId) return;
      youtubePlayerInstance = new YT.Player('youtubePlayerHost', {
        height: '1',
        width: '1',
        videoId: possibleVideoId,
        playerVars: {
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          onReady: () => {
            youtubeReady = true;
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              setButtonState(true);
              const dur = youtubePlayerInstance.getDuration();
              if (dur > 0) {
                seekSlider.max = Math.round(dur);
                totalDurationText.textContent = formatTime(dur);
              }
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              setButtonState(false);
            }
          }
        }
      });
    };

    function setButtonState(playing) {
      playbackActive = playing;
      playIcon.style.display = playing ? 'none' : 'block';
      pauseIcon.style.display = playing ? 'block' : 'none';
    }

    function togglePlayback() {
      if (playbackActive) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      if (payload.streamUrl) {
        usingYoutubeBackend = false;
        if (!nativeAudio.src) {
          nativeAudio.src = payload.streamUrl;
        }
        nativeAudio.play().then(() => {
          setButtonState(true);
        }).catch(() => {
          fallbackToYoutube();
        });
      } else {
        fallbackToYoutube();
      }
    }

    function fallbackToYoutube() {
      if (youtubePlayerInstance && youtubeReady) {
        usingYoutubeBackend = true;
        youtubePlayerInstance.playVideo();
      } else if (possibleVideoId) {
        setTimeout(startPlayback, 400);
      }
    }

    function pausePlayback() {
      if (usingYoutubeBackend && youtubePlayerInstance) {
        youtubePlayerInstance.pauseVideo();
      } else {
        nativeAudio.pause();
      }
      setButtonState(false);
    }

    btnPlay.addEventListener('click', togglePlayback);

    nativeAudio.addEventListener('timeupdate', () => {
      if (isSeeking || usingYoutubeBackend) return;
      const cur = nativeAudio.currentTime;
      const dur = nativeAudio.duration;
      currentTimeText.textContent = formatTime(cur);
      if (dur > 0) {
        seekSlider.value = Math.round(cur);
        seekSlider.max = Math.round(dur);
        totalDurationText.textContent = formatTime(dur);
      }
    });

    nativeAudio.addEventListener('ended', () => setButtonState(false));

    setInterval(() => {
      if (!playbackActive || !usingYoutubeBackend || !youtubePlayerInstance || isSeeking) return;
      try {
        const cur = youtubePlayerInstance.getCurrentTime();
        const dur = youtubePlayerInstance.getDuration();
        currentTimeText.textContent = formatTime(cur);
        if (dur > 0) {
          seekSlider.value = Math.round(cur);
          seekSlider.max = Math.round(dur);
          totalDurationText.textContent = formatTime(dur);
        }
      } catch {}
    }, 400);

    seekSlider.addEventListener('input', () => {
      isSeeking = true;
      currentTimeText.textContent = formatTime(parseFloat(seekSlider.value));
    });

    seekSlider.addEventListener('change', () => {
      const targetTime = parseFloat(seekSlider.value);
      if (usingYoutubeBackend && youtubePlayerInstance) {
        youtubePlayerInstance.seekTo(targetTime, true);
      } else {
        nativeAudio.currentTime = targetTime;
      }
      isSeeking = false;
    });

    volumeSlider.addEventListener('input', () => {
      const vol = parseFloat(volumeSlider.value);
      nativeAudio.volume = vol;
      if (youtubePlayerInstance && youtubePlayerInstance.setVolume) {
        youtubePlayerInstance.setVolume(Math.round(vol * 100));
      }
    });

    let previousVolume = 0.9;
    btnMute.addEventListener('click', () => {
      if (volumeSlider.value > 0) {
        previousVolume = volumeSlider.value;
        volumeSlider.value = 0;
      } else {
        volumeSlider.value = previousVolume;
      }
      volumeSlider.dispatchEvent(new Event('input'));
    });

    btnCopyLink.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const origTitle = titleElement.textContent;
        titleElement.textContent = 'Link copied!';
        setTimeout(() => { titleElement.textContent = origTitle; }, 1200);
      });
    });
  </script>
</body>
</html>
