<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Riff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #121214;
      --surface: #1e1f22;
      --surface-high: #28292c;
      --surface-highest: #333438;
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --on-primary-container: #eaddff;
      --on-surface: #e6e6e8;
      --on-surface-variant: #cac4d0;
      --outline: #938f99;
      --outline-variant: #49454f;
      --accent: var(--primary);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Google Sans Text', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--on-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    .top-banner {
      width: 100%;
      height: 44px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      padding: 0 20px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: background-color 0.2s ease;
    }

    .top-banner:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .top-banner svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.2;
    }

    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: min(760px, 90vw);
      height: min(520px, 65vh);
      background: var(--accent);
      filter: blur(130px) saturate(2.4);
      opacity: 0.42;
      pointer-events: none !important;
      z-index: 0;
      border-radius: 50%;
      transition: background-color 0.6s ease, opacity 0.6s ease;
    }

    .main-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(12px, 2.5vh, 32px) 24px;
      gap: clamp(10px, 2vh, 22px);
      position: relative;
      z-index: 2;
    }

    .m3-cover-stage {
      position: relative;
      width: clamp(200px, 38vh, 330px);
      height: clamp(200px, 38vh, 330px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      flex-shrink: 0;
    }

    .m3-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .track-meta-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .track-title {
      font-size: clamp(24px, 4.2vh, 46px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: var(--on-surface);
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .track-artist {
      font-size: clamp(15px, 2.2vh, 20px);
      font-weight: 600;
      color: var(--on-surface-variant);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scrubber-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--outline);
      font-variant-numeric: tabular-nums;
      width: 42px;
      user-select: none;
    }

    /* Точный слайдер Riff (палочка с отступом) */
    .sl {
      --v: 0;
      position: relative;
      width: 100%;
      height: 28px;
      flex: 1 1 auto;
    }

    .sl-active,
    .sl-inactive {
      position: absolute;
      top: 6px;
      height: 16px;
      pointer-events: none;
      transition: background-color 0.25s ease;
    }

    .sl-active {
      left: 0;
      width: max(0px, calc((100% - 6px) * var(--v) + 3px - 8px));
      background: var(--primary);
      border-radius: 8px 3px 3px 8px;
    }

    .sl-inactive {
      right: 0;
      width: max(0px, calc(100% - ((100% - 6px) * var(--v) + 3px) - 8px));
      background: color-mix(in srgb, var(--on-surface) 16%, transparent);
      border-radius: 3px 8px 8px 3px;
    }

    .sl input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 28px;
      margin: 0;
      padding: 0;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      z-index: 5;
    }

    .sl input[type="range"]::-webkit-slider-runnable-track {
      height: 28px;
      background: transparent;
    }

    .sl input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 6px;
      height: 28px;
      border-radius: 3px;
      background: var(--primary);
      border: none;
      box-shadow: none;
      transform: none;
      transition: width 0.15s ease, background-color 0.25s ease;
    }

    .sl input[type="range"]:active::-webkit-slider-thumb {
      width: 4px;
      transform: none;
    }

    .sl input[type="range"]::-moz-range-track {
      height: 28px;
      background: transparent;
    }

    .sl input[type="range"]::-moz-range-thumb {
      width: 6px;
      height: 28px;
      border-radius: 3px;
      background: var(--primary);
      border: none;
      box-shadow: none;
      cursor: pointer;
      transition: width 0.15s ease, background-color 0.25s ease;
    }

    .sl input[type="range"]:active::-moz-range-thumb {
      width: 4px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    .btn-play {
      position: relative;
      z-index: 10;
      width: clamp(64px, 9.5vh, 80px);
      height: clamp(64px, 9.5vh, 80px);
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, filter 0.15s ease, background-color 0.3s ease, color 0.3s ease, border-radius 0.2s ease;
    }

    .btn-play.playing {
      border-radius: 24px;
    }

    .btn-play:hover {
      transform: scale(1.05);
      filter: brightness(1.06);
    }

    .btn-play:active {
      transform: scale(0.95);
    }

    .btn-play svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
      pointer-events: none !important;
    }

    .btn-icon {
      position: relative;
      z-index: 10;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-high);
      color: var(--on-surface-variant);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .btn-icon:hover {
      background: var(--surface-highest);
      color: var(--on-surface);
    }

    .btn-icon:active {
      transform: scale(0.94);
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
      pointer-events: none !important;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 170px;
    }

    .hidden-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .controls-row {
        gap: 16px;
      }
      .volume-group {
        width: 125px;
      }
    }
  </style>
</head>
<body>

  <a href="https://github.com/rootscripts/riff" target="_blank" rel="noopener" class="top-banner">
    <span>Download Riff — your best music app on your device.</span>
    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>

  <div class="hero-glow" id="heroGlow"></div>

  <main class="main-wrap">
    <div class="m3-cover-stage">
      <canvas id="m3CoverCanvas" class="m3-canvas"></canvas>
    </div>

    <div class="track-meta-block">
      <h1 class="track-title" id="trackTitle">Loading...</h1>
      <div class="track-artist" id="trackArtist"></div>
    </div>

    <div class="scrubber-row">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="sl" id="seekSlWrap">
        <div class="sl-active" id="seekSlActive"></div>
        <div class="sl-inactive" id="seekSlInactive"></div>
        <input type="range" class="pill-range" id="seekSlider" min="0" max="100" value="0">
      </div>
      <span class="time-label" id="totalDuration">0:00</span>
    </div>

    <div class="controls-row">
      <div class="volume-group">
        <button class="btn-icon" id="btnMute" title="Mute">
          <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <div class="sl" id="volSlWrap">
          <div class="sl-active" id="volSlActive"></div>
          <div class="sl-inactive" id="volSlInactive"></div>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.9">
        </div>
      </div>

      <button class="btn-play" id="btnPlay" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>
        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>

      <button class="btn-icon" id="btnCopyLink" title="Copy share link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
      </button>
    </div>
  </main>

  <audio id="nativeAudio" class="hidden-player" preload="metadata"></audio>
  <div id="youtubePlayerHost" class="hidden-player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    (function () {
      const SAMPLE_COUNT = 360;
      const PROFILE_RADIUS = 160;
      const FULL_TURN = Math.PI * 2;
      const DEGREE = Math.PI / 180;
      const BISECTION_STEPS = 56;

      const SHAPE_DEFINITIONS = [
        {
          name: "Cookie7Sided",
          kind: "cookie",
          petals: 7,
          center: [160, 608.78580952],
          stretch: 1.00227424,
          rim: [154.0236, 15.1787],
          handle: [167.8238, 5.6686],
          firstFlank: [[153.2414, 15.8961], [152.2361, 16.7034], [150.3202, 18.3516]],
          secondFlank: [[149.7071, 18.9139], [149.4061, 19.195], [149.1302, 19.4773]],
          valleyHandle: [145.6613, 23.5231]
        },
        {
          name: "Cookie9Sided",
          kind: "cookie",
          petals: 9,
          center: [1503, 163.34198056],
          stretch: 1.01036691,
          rim: [154.3557, 11.7227],
          handle: [165.6694, 4.4348],
          firstFlank: [[153.9368, 12.0547], [153.4294, 12.4257], [152.4353, 13.1735]],
          secondFlank: [[151.9994, 13.5097], [151.7843, 13.6784], [151.5812, 13.8451]],
          valleyHandle: [147.3456, 17.7843]
        },
        {
          name: "Cookie12Sided",
          kind: "cookie",
          petals: 12,
          center: [1974, 604.001],
          stretch: 1,
          rim: [152.8016, 8.376],
          handle: [163.2344, 3.4256],
          firstFlank: [[152.6152, 8.4738], [152.3933, 8.5891], [151.9524, 8.8207]],
          secondFlank: [[151.6913, 8.9609], [151.5576, 9.0305], [151.4338, 9.0971]],
          valleyHandle: [145.4447, 12.6887]
        },
        {
          name: "Clover4Leaf",
          kind: "clover",
          center: [1066.99925, 604.003],
          outerStart: [38.73, -133.7908],
          outerHandle: [98.8705, -159.911],
          innerStart: [129.471, -28.79],
          innerHandle: [121.4998, -10.42]
        }
      ];

      function pointOnCurve(curve, t) {
        const rest = 1 - t;
        const a = rest * rest * rest;
        const b = 3 * rest * rest * t;
        const c = 3 * rest * t * t;
        const d = t * t * t;
        return [
          a * curve[0][0] + b * curve[1][0] + c * curve[2][0] + d * curve[3][0],
          a * curve[0][1] + b * curve[1][1] + c * curve[2][1] + d * curve[3][1]
        ];
      }

      function straightLine(from, to) {
        const stepX = (to[0] - from[0]) / 3;
        const stepY = (to[1] - from[1]) / 3;
        return [from, [from[0] + stepX, from[1] + stepY], [from[0] + 2 * stepX, from[1] + 2 * stepY], to];
      }

      function placeOnPolar(center, stretch, radius, angle) {
        return [center[0] + radius * Math.cos(angle), center[1] + stretch * radius * Math.sin(angle)];
      }

      function normalizeAngleDifference(difference) {
        let result = difference % FULL_TURN;
        if (result > Math.PI) result -= FULL_TURN;
        if (result <= -Math.PI) result += FULL_TURN;
        return result;
      }

      function buildCookieOutline(definition) {
        const { petals, center, stretch, rim, handle, firstFlank, secondFlank, valleyHandle } = definition;
        const lobeStep = FULL_TURN / petals;
        const outline = [];

        for (let lobe = 0; lobe < petals; lobe++) {
          const baseAngle = -Math.PI / 2 + lobe * lobeStep;
          const place = (point) => placeOnPolar(center, stretch, point[0], baseAngle + point[1] * DEGREE);
          const placeMirrored = (point) => placeOnPolar(center, stretch, point[0], baseAngle + lobeStep - point[1] * DEGREE);
          const placeLeft = (point) => place([point[0], -point[1]]);

          const firstFlankEnd = firstFlank[2];
          const secondFlankEnd = secondFlank[2];

          outline.push([placeLeft(rim), placeLeft(handle), place(handle), place(rim)]);
          outline.push([place(rim), place(firstFlank[0]), place(firstFlank[1]), place(firstFlankEnd)]);
          outline.push([place(firstFlankEnd), place(secondFlank[0]), place(secondFlank[1]), place(secondFlankEnd)]);
          outline.push([place(secondFlankEnd), place(valleyHandle), placeMirrored(valleyHandle), placeMirrored(secondFlankEnd)]);
          outline.push([placeMirrored(secondFlankEnd), placeMirrored(secondFlank[1]), placeMirrored(secondFlank[0]), placeMirrored(firstFlankEnd)]);
          outline.push([placeMirrored(firstFlankEnd), placeMirrored(firstFlank[1]), placeMirrored(firstFlank[0]), placeMirrored(rim)]);
        }

        return outline;
      }

      function buildCloverOutline(definition) {
        const { center, outerStart, outerHandle, innerStart, innerHandle } = definition;
        const outline = [];

        const turnQuarters = (point, quarters) => {
          let x = point[0];
          let y = point[1];
          for (let step = 0; step < quarters; step++) {
            const turnedX = -y;
            y = x;
            x = turnedX;
          }
          return [center[0] + x, center[1] + y];
        };

        for (let quarter = 0; quarter < 4; quarter++) {
          const place = (point) => turnQuarters(point, quarter);
          const outerArc = [
            place(outerStart),
            place(outerHandle),
            place([-outerHandle[1], -outerHandle[0]]),
            place([-outerStart[1], -outerStart[0]])
          ];
          const innerArc = [
            place(innerStart),
            place(innerHandle),
            place([innerHandle[0], -innerHandle[1]]),
            place([innerStart[0], -innerStart[1]])
          ];
          const nextOuterStart = turnQuarters(outerStart, quarter + 1);

          outline.push(outerArc);
          outline.push(straightLine(outerArc[3], innerArc[0]));
          outline.push(innerArc);
          outline.push(straightLine(innerArc[3], nextOuterStart));
        }

        return outline;
      }

      function buildOutline(definition) {
        return definition.kind === "clover" ? buildCloverOutline(definition) : buildCookieOutline(definition);
      }

      function findCurveBounds(curve) {
        const bounds = [Infinity, Infinity, -Infinity, -Infinity];
        const include = (point) => {
          bounds[0] = Math.min(bounds[0], point[0]);
          bounds[1] = Math.min(bounds[1], point[1]);
          bounds[2] = Math.max(bounds[2], point[0]);
          bounds[3] = Math.max(bounds[3], point[1]);
        };

        include(curve[0]);
        include(curve[3]);

        for (let axis = 0; axis < 2; axis++) {
          const first = curve[1][axis] - curve[0][axis];
          const second = curve[2][axis] - curve[1][axis];
          const third = curve[3][axis] - curve[2][axis];
          const a = first - 2 * second + third;
          const b = 2 * (second - first);
          const c = first;
          const roots = [];

          if (Math.abs(a) < 1e-12) {
            if (Math.abs(b) > 1e-12) roots.push(-c / b);
          } else {
            const discriminant = b * b - 4 * a * c;
            if (discriminant >= 0) {
              const root = Math.sqrt(discriminant);
              roots.push((-b + root) / (2 * a), (-b - root) / (2 * a));
            }
          }

          roots.forEach((t) => {
            if (t > 0 && t < 1) include(pointOnCurve(curve, t));
          });
        }

        return bounds;
      }

      function findBoundsCenter(outline) {
        const total = [Infinity, Infinity, -Infinity, -Infinity];
        outline.forEach((curve) => {
          const bounds = findCurveBounds(curve);
          total[0] = Math.min(total[0], bounds[0]);
          total[1] = Math.min(total[1], bounds[1]);
          total[2] = Math.max(total[2], bounds[2]);
          total[3] = Math.max(total[3], bounds[3]);
        });
        return [(total[0] + total[2]) / 2, (total[1] + total[3]) / 2];
      }

      function angleFromCenter(point, center) {
        return Math.atan2(point[1] - center[1], point[0] - center[0]);
      }

      function createSections(outline, center) {
        const sections = [];
        let angle = angleFromCenter(outline[0][0], center);

        outline.forEach((curve) => {
          const startAngle = angle;
          const endAngle = startAngle + normalizeAngleDifference(angleFromCenter(curve[3], center) - startAngle);
          sections.push({ curve, startAngle, endAngle });
          angle = endAngle;
        });

        return sections;
      }

      function reverseOutline(outline) {
        return outline.slice().reverse().map((curve) => curve.slice().reverse());
      }

      function createAscendingSections(outline, center) {
        let sections = createSections(outline, center);
        const sweep = sections[sections.length - 1].endAngle - sections[0].startAngle;
        if (sweep < 0) sections = createSections(reverseOutline(outline), center);
        return sections;
      }

      function measureRadius(sections, center, angle) {
        const firstAngle = sections[0].startAngle;
        const target = firstAngle + ((((angle - firstAngle) % FULL_TURN) + FULL_TURN) % FULL_TURN);
        let section = sections[sections.length - 1];

        for (let index = 0; index < sections.length; index++) {
          if (target >= sections[index].startAngle && target <= sections[index].endAngle) {
            section = sections[index];
            break;
          }
        }

        let low = 0;
        let high = 1;
        for (let step = 0; step < BISECTION_STEPS; step++) {
          const middle = (low + high) / 2;
          const point = pointOnCurve(section.curve, middle);
          const pointAngle = section.startAngle + normalizeAngleDifference(angleFromCenter(point, center) - section.startAngle);
          if (pointAngle < target) low = middle; else high = middle;
        }

        const point = pointOnCurve(section.curve, (low + high) / 2);
        return Math.hypot(point[0] - center[0], point[1] - center[1]);
      }

      function createProfile(definition) {
        const outline = buildOutline(definition);
        const center = findBoundsCenter(outline);
        const sections = createAscendingSections(outline, center);
        const radii = new Float32Array(SAMPLE_COUNT);
        let largestRadius = 0;

        for (let index = 0; index < SAMPLE_COUNT; index++) {
          const angle = -Math.PI + (FULL_TURN * index) / SAMPLE_COUNT;
          radii[index] = measureRadius(sections, center, angle);
          if (radii[index] > largestRadius) largestRadius = radii[index];
        }

        const scale = PROFILE_RADIUS / largestRadius;
        for (let index = 0; index < SAMPLE_COUNT; index++) radii[index] *= scale;
        return radii;
      }

      function easeInOutCubic(progress) {
        return progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      }

      const shapeProfiles = SHAPE_DEFINITIONS.map(createProfile);
      const shapeHistory = [0];

      function chooseNextShape(current) {
        const lastShown = shapeHistory[shapeHistory.length - 1];
        if (current !== undefined && (shapeHistory.length === 0 || lastShown !== current)) {
          shapeHistory.push(current);
        }

        const recentlyShown = shapeHistory.slice(-2);
        const candidates = shapeProfiles.map((_, index) => index).filter((index) => !recentlyShown.includes(index));
        const chosen = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : 0;

        shapeHistory.push(chosen);
        if (shapeHistory.length > 10) shapeHistory.shift();
        return chosen;
      }

      window.RiffShapes = {
        K: SAMPLE_COUNT,
        HOLD_MS: 2400,
        MORPH_MS: 1300,
        ease: easeInOutCubic,
        ready: () => shapeProfiles.length > 0,
        profile: (index) => shapeProfiles[index],
        next: chooseNextShape
      };
    })();

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    function applyDynamicM3Theme(h, s) {
      const intensity = Math.min(1, Math.max(0, s / 85));
      const priSat = Math.round(18 + intensity * 74);
      const surfSat = Math.round(intensity * 36);

      const pri = `hsl(${h}, ${priSat}%, 78%)`;
      const onPri = `hsl(${h}, ${Math.min(100, priSat)}%, 16%)`;
      const priCont = `hsl(${h}, ${Math.round(priSat * 0.75)}%, 30%)`;
      const onPriCont = `hsl(${h}, ${priSat}%, 92%)`;
      const bg = `hsl(${h}, ${surfSat}%, 8%)`;
      const surface = `hsl(${h}, ${surfSat}%, 12%)`;
      const surfaceHigh = `hsl(${h}, ${surfSat}%, 17%)`;
      const surfaceHighest = `hsl(${h}, ${surfSat}%, 22%)`;
      const onSurface = `hsl(${h}, ${Math.round(surfSat * 0.6)}%, 93%)`;
      const onSurfaceVariant = `hsl(${h}, ${Math.round(surfSat * 0.7)}%, 78%)`;
      const outline = `hsl(${h}, ${Math.round(surfSat * 0.5)}%, 58%)`;

      const root = document.documentElement.style;
      root.setProperty('--primary', pri);
      root.setProperty('--on-primary', onPri);
      root.setProperty('--primary-container', priCont);
      root.setProperty('--on-primary-container', onPriCont);
      root.setProperty('--bg', bg);
      root.setProperty('--surface', surface);
      root.setProperty('--surface-high', surfaceHigh);
      root.setProperty('--surface-highest', surfaceHighest);
      root.setProperty('--on-surface', onSurface);
      root.setProperty('--on-surface-variant', onSurfaceVariant);
      root.setProperty('--outline', outline);
      root.setProperty('--accent', pri);

      heroGlow.style.background = pri;
      heroGlow.style.opacity = String((0.22 + intensity * 0.28).toFixed(2));
    }

    function analyzeCoverAndTheme(img) {
      const c = document.createElement('canvas');
      c.width = 48;
      c.height = 48;
      const x = c.getContext('2d');
      try {
        x.drawImage(img, 0, 0, 48, 48);
        const data = x.getImageData(0, 0, 48, 48).data;
        const bins = Array.from({ length: 24 }, () => ({ weight: 0, sSum: 0, hSum: 0 }));
        let totalChromatic = 0;
        let maxWeight = 0;
        let bestBin = null;

        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 128) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const [h, s, l] = rgbToHsl(r, g, b);
          if (l >= 10 && l <= 90 && s >= 10) {
            totalChromatic++;
            const idx = Math.min(23, Math.floor(h / 15));
            const bin = bins[idx];
            const w = (s / 100) * (1 - Math.abs(l - 50) / 55);
            bin.weight += Math.max(0.1, w);
            bin.sSum += s;
            bin.hSum += h;
            if (bin.weight > maxWeight) {
              maxWeight = bin.weight;
              bestBin = bin;
            }
          }
        }

        if (bestBin && totalChromatic > 20) {
          const countEstimate = bins.reduce((acc, b) => acc + (b === bestBin ? 1 : 0), 0);
          let avgH = 0, avgS = 0, cnt = 0;
          for (let i = 0; i < data.length; i += 4) {
            const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
            if (l >= 10 && l <= 90 && s >= 10 && Math.min(23, Math.floor(h / 15)) === bins.indexOf(bestBin)) {
              avgH += h;
              avgS += s;
              cnt++;
            }
          }
          const finalHue = cnt > 0 ? Math.round(avgH / cnt) : 270;
          const finalSat = cnt > 0 ? Math.round(avgS / cnt) : 70;
          applyDynamicM3Theme(finalHue, finalSat);
          return true;
        } else {
          applyDynamicM3Theme(270, 8);
          return true;
        }
      } catch {
        return false;
      }
    }

    function parseParameters() {
      const query = window.location.search || window.location.hash || '';
      const params = new Map();
      const clean = query.replace(/^[?#]/, '');
      const segments = clean.split(/[?&]/);
      for (const pair of segments) {
        if (!pair) continue;
        const eqIdx = pair.indexOf('=');
        if (eqIdx !== -1) {
          const key = decodeClean(pair.slice(0, eqIdx));
          const val = decodeClean(pair.slice(eqIdx + 1));
          params.set(key, val);
        }
      }
      return {
        type: params.get('t') || 'music',
        title: params.get('n') || '',
        artist: params.get('a') || '',
        streamUrl: params.get('stream') || '',
        mediaUrl: params.get('url') || '',
        image: params.get('img') || '',
        duration: parseInt(params.get('dur') || '0', 10)
      };
    }

    function decodeClean(str) {
      if (!str) return '';
      try {
        return decodeURIComponent(str.replace(/\+/g, ' ')).trim();
      } catch {
        return str.replace(/\+/g, ' ').trim();
      }
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    const payload = parseParameters();

    const titleElement = document.getElementById('trackTitle');
    const artistElement = document.getElementById('trackArtist');
    const pageTitle = document.getElementById('pageTitle');
    const heroGlow = document.getElementById('heroGlow');

    const nativeAudio = document.getElementById('nativeAudio');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const seekSlider = document.getElementById('seekSlider');
    const seekSlWrap = document.getElementById('seekSlWrap');
    const currentTimeText = document.getElementById('currentTime');
    const totalDurationText = document.getElementById('totalDuration');
    const volumeSlider = document.getElementById('volumeSlider');
    const volSlWrap = document.getElementById('volSlWrap');
    const btnMute = document.getElementById('btnMute');
    const btnCopyLink = document.getElementById('btnCopyLink');

    titleElement.textContent = payload.title || payload.artist || 'Untitled';
    artistElement.textContent = payload.artist || '';
    pageTitle.textContent = payload.title ? `${payload.title} — ${payload.artist}` : 'Riff';

    if (payload.duration > 0) {
      totalDurationText.textContent = formatTime(payload.duration);
      seekSlider.max = payload.duration;
    }

    function updateSliderVisuals(slider, wrap) {
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const val = parseFloat(slider.value) || 0;
      const ratio = max > min ? Math.max(0, Math.min(1, (val - min) / (max - min))) : 0;
      wrap.style.setProperty('--v', ratio.toFixed(4));
    }

    updateSliderVisuals(seekSlider, seekSlWrap);
    updateSliderVisuals(volumeSlider, volSlWrap);

    const canvas = document.getElementById('m3CoverCanvas');
    const dpr = window.devicePixelRatio || 1;
    const CANVAS_SIZE = 360;
    canvas.width = CANVAS_SIZE * dpr;
    canvas.height = CANVAS_SIZE * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    let activeCoverImage = null;
    let imageReady = false;

    function loadCoverWithCorsFallback(rawUrl) {
      if (!rawUrl) return;
      const proxyUrl = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&w=600&h=600&fit=cover&output=jpg`;

      const corsImg = new Image();
      corsImg.crossOrigin = 'Anonymous';
      corsImg.onload = () => {
        activeCoverImage = corsImg;
        imageReady = true;
        if (!analyzeCoverAndTheme(corsImg)) {
          loadViaProxy(proxyUrl);
        }
      };
      corsImg.onerror = () => {
        loadViaProxy(proxyUrl, rawUrl);
      };
      corsImg.src = rawUrl;
    }

    function loadViaProxy(proxyUrl, fallbackRawUrl) {
      const proxyImg = new Image();
      proxyImg.crossOrigin = 'Anonymous';
      proxyImg.onload = () => {
        activeCoverImage = proxyImg;
        imageReady = true;
        analyzeCoverAndTheme(proxyImg);
      };
      proxyImg.onerror = () => {
        if (!fallbackRawUrl) return;
        const plainImg = new Image();
        plainImg.onload = () => {
          activeCoverImage = plainImg;
          imageReady = true;
        };
        plainImg.src = fallbackRawUrl;
      };
      proxyImg.src = proxyUrl;
    }

    function resolveCoverSource() {
      if (payload.image) {
        loadCoverWithCorsFallback(payload.image);
        return;
      }
      const ytIdMatch = (payload.mediaUrl || '').match(/(?:v=|\/embed\/|\/watch\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
      if (ytIdMatch) {
        loadCoverWithCorsFallback(`https://i.ytimg.com/vi/${ytIdMatch[1]}/hqdefault.jpg`);
        return;
      }
      const query = `${payload.artist} ${payload.title}`.trim();
      if (query) {
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`)
          .then(r => r.json())
          .then(data => {
            const hit = data.results && data.results[0];
            if (hit && hit.artworkUrl100) {
              loadCoverWithCorsFallback(hit.artworkUrl100.replace('100x100', '600x600'));
            }
          })
          .catch(() => {});
      }
    }

    resolveCoverSource();

    const m3State = {
      from: 0,
      to: 0,
      start: 0,
      rotation: 0,
      phase: 0,
      last: 0
    };

    function getShapeRadii(now) {
      const S = window.RiffShapes;
      if (!S || !S.ready()) return null;
      if (!m3State.start) {
        m3State.start = now;
        m3State.from = 0;
        m3State.to = 0;
      }
      if (now - m3State.start >= S.HOLD_MS) {
        m3State.from = m3State.to;
        m3State.to = S.next(m3State.from);
        m3State.start = now;
      }
      const t = Math.min(1, (now - m3State.start) / S.MORPH_MS);
      return { a: S.profile(m3State.from), b: S.profile(m3State.to), e: S.ease(t) };
    }

    function renderM3Cover(now) {
      const S = window.RiffShapes;
      if (!ctx || !S) return;

      if (!m3State.last) m3State.last = now;
      const delta = Math.min(48, Math.max(0, now - m3State.last));
      m3State.last = now;

      const rotSpeed = playbackActive ? 0.00045 : 0.00012;
      m3State.rotation = (m3State.rotation + rotSpeed * delta) % (Math.PI * 2);
      if (playbackActive) m3State.phase += 0.006 * delta;

      const sh = getShapeRadii(now);
      if (!sh) return;

      const K = S.K;
      const cx = CANVAS_SIZE / 2;
      const cy = CANVAS_SIZE / 2;
      const coverSize = 250;
      const scale = (coverSize / 2) / 160;
      const rot = m3State.rotation;

      function radiusAt(shapeAngle) {
        const f = ((shapeAngle + Math.PI) / (Math.PI * 2)) * K;
        const i0 = ((Math.floor(f) % K) + K) % K;
        const i1 = (i0 + 1) % K;
        const w = f - Math.floor(f);
        const r0 = sh.a[i0] + (sh.b[i0] - sh.a[i0]) * sh.e;
        const r1 = sh.a[i1] + (sh.b[i1] - sh.a[i1]) * sh.e;
        return (r0 + (r1 - r0) * w) * scale;
      }

      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      ctx.save();
      ctx.beginPath();
      for (let k = 0; k <= K; k++) {
        const th = -Math.PI + (Math.PI * 2 * (k % K)) / K;
        const r = radiusAt(th);
        const x = cx + Math.cos(th + rot) * r;
        const y = cy + Math.sin(th + rot) * r;
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.clip();

      if (imageReady && activeCoverImage) {
        const iw = activeCoverImage.naturalWidth || 300;
        const ih = activeCoverImage.naturalHeight || 300;
        const side = Math.min(iw, ih);
        const targetSide = Math.ceil(coverSize * 1.08);
        ctx.drawImage(activeCoverImage, (iw - side) / 2, (ih - side) / 2, side, side, cx - targetSide / 2, cy - targetSide / 2, targetSide, targetSide);
      } else {
        ctx.fillStyle = '#2b2930';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      }
      ctx.restore();

      const duration = parseFloat(seekSlider.max) || 100;
      const currentPos = parseFloat(seekSlider.value) || 0;
      const progress = duration > 0 ? Math.min(1, Math.max(0, currentPos / duration)) : 0;
      const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#d0bcff';

      const STEPS = 220;
      const ringGap = 12;
      const ringWidth = 3.5;

      function ringPoint(phi, wave) {
        const r = radiusAt(phi - rot) + ringGap + ringWidth / 2 + wave;
        return [cx + Math.cos(phi) * r, cy + Math.sin(phi) * r];
      }

      const startPhi = -Math.PI / 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = ringWidth;
      ctx.strokeStyle = primaryColor;

      ctx.setLineDash([0.1, 7.5]);
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      const restFrom = Math.round(progress * STEPS);
      for (let s = restFrom; s <= STEPS; s++) {
        const [x, y] = ringPoint(startPhi + (Math.PI * 2 * s) / STEPS, 0);
        if (s === restFrom) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      if (progress > 0) {
        ctx.beginPath();
        const playedSteps = Math.max(2, Math.round(progress * STEPS));
        for (let s = 0; s <= playedSteps; s++) {
          const phi = startPhi + (Math.PI * 2 * s) / STEPS;
          const waveVal = playbackActive ? Math.sin(phi * 24 + m3State.phase) * 1.8 : 0;
          const [x, y] = ringPoint(phi, waveVal);
          if (s === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      requestAnimationFrame(renderM3Cover);
    }

    requestAnimationFrame(renderM3Cover);

    let playbackActive = false;
    let isSeeking = false;
    let youtubePlayerInstance = null;
    let usingYoutubeBackend = false;
    let youtubeReady = false;

    function extractVideoId(rawUrl) {
      if (!rawUrl) return '';
      const match = rawUrl.match(/(?:v=|\/embed\/|\/watch\/|youtu\.be\/|\/v\/|^)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : '';
    }

    const possibleVideoId = extractVideoId(payload.mediaUrl);

    window.onYouTubeIframeAPIReady = function() {
      if (!possibleVideoId) return;
      youtubePlayerInstance = new YT.Player('youtubePlayerHost', {
        height: '1',
        width: '1',
        videoId: possibleVideoId,
        playerVars: {
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          onReady: () => {
            youtubeReady = true;
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              setButtonState(true);
              const dur = youtubePlayerInstance.getDuration();
              if (dur > 0) {
                seekSlider.max = Math.round(dur);
                totalDurationText.textContent = formatTime(dur);
              }
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              setButtonState(false);
            }
          }
        }
      });
    };

    function setButtonState(playing) {
      playbackActive = playing;
      btnPlay.classList.toggle('playing', playing);
      playIcon.style.display = playing ? 'none' : 'block';
      pauseIcon.style.display = playing ? 'block' : 'none';
    }

    function togglePlayback() {
      if (playbackActive) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    function startPlayback() {
      if (payload.streamUrl) {
        usingYoutubeBackend = false;
        if (!nativeAudio.src) {
          nativeAudio.src = payload.streamUrl;
        }
        nativeAudio.play().then(() => {
          setButtonState(true);
        }).catch(() => {
          fallbackToYoutube();
        });
      } else {
        fallbackToYoutube();
      }
    }

    function fallbackToYoutube() {
      if (youtubePlayerInstance && youtubeReady) {
        usingYoutubeBackend = true;
        youtubePlayerInstance.playVideo();
      } else if (possibleVideoId) {
        setTimeout(startPlayback, 300);
      }
    }

    function pausePlayback() {
      if (usingYoutubeBackend && youtubePlayerInstance) {
        youtubePlayerInstance.pauseVideo();
      } else {
        nativeAudio.pause();
      }
      setButtonState(false);
    }

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayback();
    });

    nativeAudio.addEventListener('timeupdate', () => {
      if (isSeeking || usingYoutubeBackend) return;
      const cur = nativeAudio.currentTime;
      const dur = nativeAudio.duration;
      currentTimeText.textContent = formatTime(cur);
      if (dur > 0) {
        seekSlider.value = Math.round(cur);
        seekSlider.max = Math.round(dur);
        totalDurationText.textContent = formatTime(dur);
      }
      updateSliderVisuals(seekSlider, seekSlWrap);
    });

    nativeAudio.addEventListener('ended', () => setButtonState(false));

    setInterval(() => {
      if (!playbackActive || !usingYoutubeBackend || !youtubePlayerInstance || isSeeking) return;
      try {
        const cur = youtubePlayerInstance.getCurrentTime();
        const dur = youtubePlayerInstance.getDuration();
        currentTimeText.textContent = formatTime(cur);
        if (dur > 0) {
          seekSlider.value = Math.round(cur);
          seekSlider.max = Math.round(dur);
          totalDurationText.textContent = formatTime(dur);
        }
        updateSliderVisuals(seekSlider, seekSlWrap);
      } catch {}
    }, 350);

    seekSlider.addEventListener('input', () => {
      isSeeking = true;
      currentTimeText.textContent = formatTime(parseFloat(seekSlider.value));
      updateSliderVisuals(seekSlider, seekSlWrap);
    });

    seekSlider.addEventListener('change', () => {
      const targetTime = parseFloat(seekSlider.value);
      if (usingYoutubeBackend && youtubePlayerInstance) {
        youtubePlayerInstance.seekTo(targetTime, true);
      } else {
        nativeAudio.currentTime = targetTime;
      }
      isSeeking = false;
      updateSliderVisuals(seekSlider, seekSlWrap);
    });

    volumeSlider.addEventListener('input', () => {
      const vol = parseFloat(volumeSlider.value);
      nativeAudio.volume = vol;
      if (youtubePlayerInstance && youtubePlayerInstance.setVolume) {
        youtubePlayerInstance.setVolume(Math.round(vol * 100));
      }
      updateSliderVisuals(volumeSlider, volSlWrap);
    });

    let previousVolume = 0.9;
    btnMute.addEventListener('click', (e) => {
      e.stopPropagation();
      if (volumeSlider.value > 0) {
        previousVolume = volumeSlider.value;
        volumeSlider.value = 0;
      } else {
        volumeSlider.value = previousVolume;
      }
      volumeSlider.dispatchEvent(new Event('input'));
    });

    btnCopyLink.addEventListener('click', (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(window.location.href).then(() => {
        const origTitle = titleElement.textContent;
        titleElement.textContent = 'Link copied!';
        setTimeout(() => { titleElement.textContent = origTitle; }, 1200);
      });
    });
  </script>
</body>
</html>
